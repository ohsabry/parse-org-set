name: CI

on:
  push:
    branches: [main]
  pull_request:

# Actions are pinned to exact commits (with the version beside them), so a
# moved tag can't swap in different code.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      # Fails if bun.lock doesn't match package.json.
      - run: bun install --frozen-lockfile

      # Type checks, ESLint, the Prettier check and the tests. The real-file
      # smoke tests skip themselves: no .Set files are ever in the repo.
      - run: bun run verify

      # The bundle that gets published to npm.
      - run: bun run --cwd packages/cli build

  # The built page in real browsers: Chromium, Firefox and WebKit (Safari's engine).
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - run: bun install --frozen-lockfile

      # The three browsers, plus the Linux libraries they need.
      - run: bunx playwright install --with-deps chromium firefox webkit
        working-directory: packages/web

      - run: bun run test:e2e

  # Publishes the web page, only for pushes to main and only after every check
  # above passed: green main is live, red never is.
  deploy:
    needs: [verify, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Only this job may publish. GitHub issues a short-lived token for the run,
    # so no secrets are stored.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # One deploy at a time; a newer push waits rather than racing an older one.
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - run: bun install --frozen-lockfile

      - run: bun run web:build

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: packages/web/dist

      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
